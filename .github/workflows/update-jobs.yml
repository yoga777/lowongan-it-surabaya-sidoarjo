name: Update lowongan (tiap jam)

on:
  schedule:
    # Setiap jam tepat pada menit ke-0 (UTC) = tiap jam juga di WIB (UTC+7)
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ambil lowongan terbaru
        run: python3 scripts/update_jobs.py
      - name: Commit kalau ada perubahan
        run: |
          if [[ -n "$(git status --porcelain data/jobs.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/jobs.json
            git commit -m "chore: perbarui data lowongan (otomatis)"
            git push
          else
            echo "Tidak ada perubahan data."
          fi
